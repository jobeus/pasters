<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New paste</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --border: #d2d2d7; --accent: #0a66d8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #e8e8ed; --muted: #8e8e93; --border: #3a3a3c; --accent: #4c9bff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
  h1 { font-size: 18px; margin: 0; } h1 a { color: inherit; text-decoration: none; }
  form { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  textarea { flex: 1; min-height: 60vh; width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px;
             background: transparent; color: inherit; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; tab-size: 4; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  button, .file { padding: 8px 20px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .file { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
{UPLOAD_STYLE}
</style>
</head>
<body data-page="web" data-max-text="{MAX_TEXT}" data-max-image="{MAX_IMAGE}">
<main>
  <h1><a href="/">paste</a></h1>
  <form method="post" action="/web">
    <textarea name="content" placeholder="Paste text, markdown or an image here…" autofocus required spellcheck="false"></textarea>
    <div class="row">
      <span>Text or markdown up to {MAX_KB}KiB (add <code>.md</code> to the link to render it), or a PNG/JPEG up to {MAX_IMAGE_MB}MiB: pick, drop or paste one.</span>
      <div class="actions">
        <label class="file">Upload image<input type="file" id="file" accept="image/png,image/jpeg"></label>
        <button type="submit">Paste</button>
      </div>
    </div>
  </form>
</main>
<script>
{UPLOAD_SCRIPT}
</script>
</body>
</html>
