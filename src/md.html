<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{TITLE}</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --code-bg: #f6f8fa; --link: #0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --code-bg: #151b23; --link: #4493f8; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  article { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; overflow-wrap: break-word; }
  a { color: var(--link); }
  h1, h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.5em 0 .75em; }
  article > :first-child { margin-top: 0; }
  code { font: .875em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: .2em .4em; border-radius: 4px; }
  pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow-x: auto; line-height: 1.45; }
  pre code { background: none; padding: 0; font-size: 13.6px; }
  blockquote { margin: 0 0 1em; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin-bottom: 1em; }
  th, td { border: 1px solid var(--border); padding: 6px 13px; }
  th { font-weight: 600; }
  img { max-width: 100%; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
  li > input[type=checkbox] { margin-right: .4em; }
  .raw { position: fixed; top: 8px; right: 12px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<a class="raw" href="/{TITLE}">raw</a>
<article>
{BODY}
</article>
</body>
</html>
