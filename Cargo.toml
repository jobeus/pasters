[package]
name = "pasters"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hmac = "0.13.0"
logfire = "0.13.1"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
