# /etc/apache2/sites-available/005-paste.jobe.wtf.conf
# Needs: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName paste.jobe.wtf

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/jobe.wtf/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jobe.wtf/privkey.pem

    ProxyPreserveHost On
    # Deploy webhook from GitHub Actions (DEPLOY_WEBHOOK_URL=https://paste.jobe.wtf/__deploy).
    # pasters binds it to 127.0.0.1:8787 only. Must come before `ProxyPass /`; paste ids are
    # alphanumeric, so this path can't collide with one.
    ProxyPass /__deploy http://127.0.0.1:8787/deploy
    ProxyPassReverse /__deploy http://127.0.0.1:8787/deploy
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"
    # mod_proxy appends the client to X-Forwarded-For; pasters reads it when
    # PASTE_TRUST_PROXY=1, otherwise every client logs as 127.0.0.1.

    # The app truncates text at 128 KiB and refuses images over 20 MiB.
    LimitRequestBody 25000000

    ErrorLog ${APACHE_LOG_DIR}/paste_error.log
    CustomLog ${APACHE_LOG_DIR}/paste_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName paste.jobe.wtf
    Redirect permanent / https://paste.jobe.wtf/
</VirtualHost>
